---
- name: Retrieve Credentials for AO on OpenShift
  become: false
  connection: local
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
    # Public overrides — keep ao_* names so existing callers do not regress
    ao_namespace: automation-orchestrator
    ao_route_name: orchestrator
    ao_secret_name: orchestrator-initial-admin-password
    admin_cred_label: AO
    admin_cred_namespace: "{{ ao_namespace }}"
    admin_cred_route_name: "{{ ao_route_name }}"
    admin_cred_secret_name: "{{ ao_secret_name }}"
  tasks:
    - name: Retrieve and display AO admin credentials
      ansible.builtin.include_tasks: tasks/aap_ao_get_admin_credentials.yml
