---
# Shared workflow to retrieve an OpenShift route hostname and admin password secret,
# then display endpoint/user/password.
#
# Expected variables:
#   admin_cred_label: Product label used in debug messages (e.g. AAP, AO)
#   admin_cred_namespace: Namespace containing the Route and Secret
#   admin_cred_route_name: Name of the Route resource
#   admin_cred_secret_name: Name of the Secret containing the admin password
# Optional:
#   admin_cred_user: Admin username to report (default: admin)
#   admin_cred_secret_key: Secret data key for the password (default: password)
- name: Retrieve API hostname for {{ admin_cred_label }}
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ admin_cred_namespace }}"
    name: "{{ admin_cred_route_name }}"
  register: admin_cred_route
  until: admin_cred_route.resources | length == 1
  retries: 20
  delay: 5

- name: Set ansible_host
  ansible.builtin.set_fact:
    ansible_host: "{{ admin_cred_route.resources[0].spec.host }}"

- name: Retrieve admin password for {{ admin_cred_label }}
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ admin_cred_namespace }}"
    name: "{{ admin_cred_secret_name }}"
  register: admin_pw
  until: admin_pw.resources | length == 1
  retries: 20
  delay: 5

- name: Set admin_password fact
  ansible.builtin.set_fact:
    admin_password: "{{ admin_pw.resources[0].data[admin_cred_secret_key | default('password')] | b64decode }}"

- name: Report {{ admin_cred_label }} Endpoint
  ansible.builtin.debug:
    msg: "{{ admin_cred_label }} Endpoint: https://{{ ansible_host }}"

- name: Report {{ admin_cred_label }} User
  ansible.builtin.debug:
    msg: "{{ admin_cred_label }} Admin User: {{ admin_cred_user | default('admin') }}"

- name: Report {{ admin_cred_label }} Admin Password
  ansible.builtin.debug:
    msg: "{{ admin_cred_label }} Admin Password: {{ admin_password }}"
