---
- name: Retrieve Credentials for AAP on OpenShift
  become: false
  connection: local
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
    # Public overrides — keep aap_* names so existing callers do not regress
    aap_namespace: ansible-automation-platform
    aap_route_name: aap
    aap_secret_name: aap-admin-password
    admin_cred_label: AAP
    admin_cred_namespace: "{{ aap_namespace }}"
    admin_cred_route_name: "{{ aap_route_name }}"
    admin_cred_secret_name: "{{ aap_secret_name }}"
  tasks:
    - name: Retrieve and display AAP admin credentials
      ansible.builtin.include_tasks: tasks/aap_ao_get_admin_credentials.yml
