---
- name: Importing ACM clusters automatically
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Set VP_HUBCONFIG and VP_SPOKECONFIG facts from env variables
      ansible.builtin.set_fact:
        VP_HUBCONFIG: "{{ lookup('env', 'VP_HUBCONFIG') }}" # noqa var-naming
        VP_SPOKECONFIG: "{{ lookup('env', 'VP_SPOKECONFIG') }}" # noqa var-naming

  roles:
    - acm_import
